name: Python tests

on:
  pull_request:
    branches: [main, hardening/agent-output-validation]
  push:
    branches: [main, "feature/agent-orchestrator-v1", "feature/orchestrator-metric-validation", "feat/native-ai-engine-hybrid"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
